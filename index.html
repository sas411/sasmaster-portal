<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SaSMaster — Media Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap">

<link rel="stylesheet" href="src/global.css?v=3" />
<link rel="stylesheet" href="src/shell.css" />
<link rel="stylesheet" href="src/home.css?v=7" />
<link rel="stylesheet" href="src/portals.css" />
<link rel="stylesheet" href="src/macro.css?v=1" />
<link rel="stylesheet" href="src/theme.css?v=3" />
<link rel="stylesheet" href="src/program-route.css?v=2" />

<style>
  /* Page-level chrome */
  .app-stage { position: relative; min-height: 100vh; }
  .portal-stage {
    opacity: 1;
  }
  /* Tweaks button */
  .tweaks-fab {
    position: fixed; left: 18px; bottom: 18px; z-index: 1400;
    background: var(--surface2); color: var(--gold);
    border: 1px solid var(--border-gold);
    font-family: var(--label); font-size: 10px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 9px 14px; cursor: pointer;
  }
  .tweaks-fab:hover { background: var(--gold-dim); }
  .tweaks-fab.hidden { display: none; }

  /* Boot splash */
  .boot {
    position: fixed; inset: 0; z-index: 9999; background: #000;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    animation: fadeIn .25s var(--ease);
  }
  .boot.gone { animation: fadeIn .4s var(--ease) reverse forwards; pointer-events: none; }
  .boot-ring {
    width: 78px; height: 78px; border: 1px solid var(--gold-mid);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spinSlow 1.2s linear infinite;
  }
  .boot-text {
    font-family: var(--mono); font-size: 11px; color: var(--gold);
    letter-spacing: 4px; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Boot splash (removed by app once mounted) -->
<div class="boot" id="boot">
  <div class="boot-ring"></div>
  <div class="boot-text">SASMASTER · INITIALIZING</div>
</div>

<!-- Tweaks defaults (persistable) -->
<script>
  window.SM_TWEAKS = /*EDITMODE-BEGIN*/{
    "accent": "#6b8bd6",
    "density": "spacious",
    "showTicker": true,
    "scoopVisible": true
  }/*EDITMODE-END*/;
</script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data first, then components -->
<script src="src/data.js"></script>
<script src="src/tmdb.js?v=1"></script>
<script type="text/babel" src="src/shell.jsx"></script>
<script type="text/babel" src="src/theme.jsx?v=2"></script>
<script type="text/babel" src="src/home.jsx?v=5"></script>
<script type="text/babel" src="src/macro.jsx?v=1"></script>
<script type="text/babel" src="src/portals.jsx?v=3"></script>
<script type="text/babel" src="src/program-route-rails.jsx?v=1"></script>
<script type="text/babel" src="src/pr-keyart.jsx?v=1"></script>
<script type="text/babel" src="src/program-route.jsx?v=2"></script>

<!-- App root -->
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const D = window.SASMASTER_DATA;

const PORTAL_COMPONENTS = {
  content: window.ContentPortal,
  advertising: window.AdvertisingPortal,
  marketing: window.MarketingPortal,
  cpg: window.CPGPortal,
  exchange: window.ExchangePortal,
};

const PORTAL_META = {
  content:     { label: 'CONTENT',     accent: '#f0c040' },
  advertising: { label: 'ADVERTISING', accent: '#36c5f0' },
  marketing:   { label: 'MARKETING',   accent: '#ff6b6b' },
  cpg:         { label: 'CPG',         accent: '#39d98a' },
  exchange:    { label: 'EXCHANGE',    accent: '#a78bfa' },
};

function App() {
  const initial = (() => {
    try { return localStorage.getItem('sm.view') || 'home'; } catch { return 'home'; }
  })();
  const [view, setView] = useState(initial);
  const [theme, setTheme] = window.useTheme('light');
  const [tweaks, setTweaks] = useState(window.SM_TWEAKS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaksHostAvail, setTweaksHostAvail] = useState(false);

  useEffect(() => { try { localStorage.setItem('sm.view', view); } catch {} }, [view]);

  // Boot splash hide
  useEffect(() => {
    const t = setTimeout(() => {
      const b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 500); }
    }, 700);
    return () => clearTimeout(t);
  }, []);

  // Tweaks host integration
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode')   { setTweaksHostAvail(true);  setTweaksOpen(true); }
      if (d.type === '__deactivate_edit_mode') { setTweaksHostAvail(true);  setTweaksOpen(false); }
    };
    window.addEventListener('message', onMsg);
    window.parent && window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const updateTweak = (k, v) => {
    setTweaks(t => {
      const next = { ...t, [k]: v };
      window.parent && window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      return next;
    });
  };

  // Live accent injection
  useEffect(() => {
    document.documentElement.style.setProperty('--gold', tweaks.accent);
  }, [tweaks.accent]);

  const onNav = (id) => setView(id);
  const onHome = () => setView('home');

  const ctx = view === 'home' ? 'HOME' : (PORTAL_META[view]?.label || 'HOME');

  if (view === 'home') {
    return (
      <div className="app-stage" data-screen-label="00 Home">
        <window.HomeScreen onEnterPortal={onNav} />
        {tweaks.scoopVisible && <window.DrScoop context="HOME" insights={D.INSIGHTS} />}
        <TweaksUI open={tweaksOpen} setOpen={setTweaksOpen} tweaks={tweaks} updateTweak={updateTweak} hostAvail={tweaksHostAvail} />
      </div>
    );
  }

  const PortalC = PORTAL_COMPONENTS[view];
  const portalAccent = PORTAL_META[view].accent;
  return (
    <div className="app-stage" data-theme={theme} data-screen-label={`${PORTAL_META[view].label}`}>
      <window.PortalBackdrop accent={portalAccent} />
      <window.TopNav current={view} onNav={onNav} onHome={onHome} theme={theme} onTheme={setTheme} />
      {tweaks.showTicker && <window.Ticker items={D.TICKER} />}
      <main key={view} className="portal-stage">
        {PortalC ? <PortalC /> : null}
      </main>
      {tweaks.scoopVisible && <window.DrScoop context={ctx} insights={D.INSIGHTS} />}
      <TweaksUI open={tweaksOpen} setOpen={setTweaksOpen} tweaks={tweaks} updateTweak={updateTweak} hostAvail={tweaksHostAvail} />
    </div>
  );
}

function TweaksUI({ open, setOpen, tweaks, updateTweak, hostAvail }) {
  return (
    <>
      {!hostAvail && (
        <button className={`tweaks-fab ${open ? 'hidden' : ''}`} onClick={() => setOpen(true)}>
          ◆ Tweaks
        </button>
      )}
      <div className={`tweaks-root ${open ? '' : 'hidden'}`}>
        <div className="tweaks-head">
          <span style={{ flex: 1 }}>◆ Tweaks</span>
          <button onClick={() => setOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 16 }}>×</button>
        </div>
        <div className="tweaks-body">
          <div className="tweak-row">
            <label>Accent</label>
            <input type="color" value={tweaks.accent} onChange={(e) => updateTweak('accent', e.target.value)} />
          </div>
          <div className="tweak-row">
            <label>Density</label>
            <select value={tweaks.density} onChange={(e) => updateTweak('density', e.target.value)}>
              <option value="compact">Compact</option>
              <option value="balanced">Balanced</option>
              <option value="spacious">Spacious</option>
            </select>
          </div>
          <div className="tweak-row">
            <label>Ticker</label>
            <input type="checkbox" checked={tweaks.showTicker} onChange={(e) => updateTweak('showTicker', e.target.checked)} />
          </div>
          <div className="tweak-row">
            <label>Dr. Scoop</label>
            <input type="checkbox" checked={tweaks.scoopVisible} onChange={(e) => updateTweak('scoopVisible', e.target.checked)} />
          </div>
          <div style={{ marginTop: 10, fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-muted)', letterSpacing: 1 }}>
            More tweaks unlock once<br/>nav + layout are locked.
          </div>
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
